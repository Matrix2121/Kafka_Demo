services:
  kafka-odin:
    image: apache/kafka:3.7.0
    container_name: Odin
    hostname: Odin
    network_mode: host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 
        1@[PRIVATE_IP_ODIN]:9093,
        2@[PRIVATE_IP_NOVA]:9093,
        3@[PRIVATE_IP_SORA]:9093
      KAFKA_LISTENERS: 
        INTERNAL://0.0.0.0:19092,
        EXTERNAL://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: 
        INTERNAL://[PRIVATE_IP_ODIN]:19092,
        EXTERNAL://[PUBLIC_IP_ODIN]:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
    volumes:
      - ./kafka_data:/tmp/kraft-combined-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    network_mode: host
    environment:
      KAFKA_CLUSTERS_0_NAME: "Distributed Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 
        "[PRIVATE_IP_ODIN]:19092,
        [PRIVATE_IP_NOVA]:19092,
        [PRIVATE_IP_SORA]:19092"
      KAFKA_CLUSTERS_0_PROPERTIES_REQUEST_TIMEOUT_MS: "120000" 

  kafka-init-topics:
    image: apache/kafka:3.7.0
    container_name: kafka-init-topics
    network_mode: host
    command: >
      sh -c "
        echo 'Waiting for cluster to form (30s delay)...'
        sleep 30
        echo 'Creating Crypto Exchange Topics...'
        # Use Odin's PRIVATE IP for bootstrap connection
        /opt/kafka/bin/kafka-topics.sh --create --topic market.prices.raw --partitions 6 --replication-factor 3 --bootstrap-server [PRIVATE_IP_ODIN]:9092 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --topic orders.requests.incoming --partitions 6 --replication-factor 3 --bootstrap-server [PRIVATE_IP_ODIN]:9092 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --topic wallet.balance.updates --partitions 6 --replication-factor 3 --bootstrap-server [PRIVATE_IP_ODIN]:9092 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --topic notifications.marketing.blast --partitions 6 --replication-factor 3 --bootstrap-server [PRIVATE_IP_ODIN]:9092 --if-not-exists
        echo 'All topics created successfully.'
      "
